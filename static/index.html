<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EndlessChrome</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f7cff'/%3E%3Cpath d='M18 32c0-7 6-12 14-12s14 5 14 12-6 12-14 12' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #16181d; --muted: #6b7180; --line: #e3e5ea;
    --accent: #4f7cff; --danger: #e5484d; --ok: #22b07d; --shadow: 0 1px 2px #0000000d, 0 4px 16px #00000008;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e0f13; --card: #17191f; --text: #e8eaf0; --muted: #8b91a0; --line: #262a33; --shadow: none; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 22px 24px; max-width: 1200px; margin: auto; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: 14px; }
  header .grow { flex: 1; }
  main { max-width: 1200px; margin: auto; padding: 0 24px 40px; display: grid; gap: 16px;
         grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
           border-radius: 9px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: progress; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
          box-shadow: var(--shadow); display: grid; gap: 14px; }
  .top { display: flex; gap: 12px; align-items: center; }
  .top img { width: 44px; height: 44px; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .on .dot { background: var(--ok); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .row button { padding: 5px 10px; font-size: 13px; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 70px 20px; color: var(--muted); }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text); padding: 20px; width: min(380px, 92vw); }
  dialog::backdrop { background: #0008; }
  dialog form { display: grid; gap: 14px; }
  dialog h2 { margin: 0; font-size: 17px; }
  label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  input[type=text] { font: inherit; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  input[type=color] { width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); padding: 2px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
           padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; }
  @media (max-width: 520px) { header, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>EndlessChrome</h1>
    <div class="sub" id="summary">Loading…</div>
  </div>
  <div class="grow"></div>
  <button class="primary" id="new">+ New profile</button>
</header>
<main id="grid"></main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlg-title"></h2>
    <label>Name <input type="text" id="f-name" required maxlength="60" autocomplete="off"></label>
    <label>Colour <input type="color" id="f-color"></label>
    <div class="actions"><button value="cancel" formnovalidate>Cancel</button><button class="primary" value="ok" id="f-ok"></button></div>
  </form>
</dialog>
<div id="toast" role="status"></div>

<script>
const grid = document.getElementById("grid"), dlg = document.getElementById("dlg");
const toastEl = document.getElementById("toast");
let profiles = [], busy = new Set();

function toast(text) {
  toastEl.textContent = text; toastEl.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove("show"), 3500);
}

async function api(path, method = "GET", body) {
  const r = await fetch(path, { method, headers: { "X-EndlessChrome": "1", "Content-Type": "application/json" },
                                body: body && JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

async function refresh() {
  try { profiles = (await api("/api/profiles")).profiles; } catch (e) { return toast(e.message); }
  const on = profiles.filter(p => p.running).length;
  document.getElementById("summary").textContent =
    `${profiles.length} profile${profiles.length === 1 ? "" : "s"} · ${on} running`;
  render();
}

function render() {
  if (!profiles.length) {
    grid.innerHTML = `<div class="empty">No profiles yet. Each profile is its own isolated Chromium with its own logins,
      extensions and folders.<br><br><button class="primary" onclick="openDialog('new')">Create your first profile</button></div>`;
    return;
  }
  grid.replaceChildren(...profiles.map(card));
}

function card(p) {
  const el = document.createElement("div"), b = busy.has(p.id);
  el.className = "card";
  el.innerHTML = `
    <div class="top">
      <img src="/p/${p.id}/icon.svg" alt="">
      <div style="min-width:0">
        <div class="name"></div>
        <div class="status ${p.running ? "on" : ""}"><span class="dot"></span>${b ? "Working…" : p.running ? "Running" : "Stopped"}</div>
      </div>
    </div>
    <div class="row">
      <button class="primary" data-a="open">Open</button>
      <button data-a="${p.running ? "stop" : "start"}">${p.running ? "Stop" : "Start"}</button>
      <button data-a="edit">Edit</button>
      <button data-a="clone">Clone</button>
      <button class="danger" data-a="delete">Delete</button>
    </div>
    <div class="row">
      <button data-a="folder" data-f="Downloads">Downloads</button>
      <button data-a="folder" data-f="Documents">Documents</button>
      <button data-a="folder" data-f="Shared">Shared</button>
    </div>`;
  el.querySelector(".name").textContent = p.name;
  el.querySelector(".name").title = p.name;
  el.querySelectorAll("button").forEach(btn => {
    btn.disabled = b;
    btn.onclick = () => act(p, btn.dataset.a, btn.dataset.f);
  });
  return el;
}

async function act(p, a, folder) {
  if (a === "open") return window.open(`/p/${p.id}/`, `ec-${p.id}`);
  if (a === "edit") return openDialog("edit", p);
  if (a === "clone") return openDialog("clone", p);
  if (a === "delete" && !confirm(`Delete "${p.name}" and everything in it (logins, downloads, documents)?`)) return;
  if (a === "folder") return api(`/api/profiles/${p.id}/folder/${folder}`, "POST").catch(e => toast(e.message));
  busy.add(p.id); render();
  try {
    if (a === "delete") await api(`/api/profiles/${p.id}`, "DELETE");
    else await api(`/api/profiles/${p.id}/${a}`, "POST");
  } catch (e) { toast(e.message); }
  busy.delete(p.id); refresh();
}

let mode, target;
function openDialog(m, p) {
  mode = m; target = p;
  const titles = { new: ["New profile", "Create"], edit: ["Edit profile", "Save"], clone: [`Clone "${p?.name}"`, "Clone"] };
  document.getElementById("dlg-title").textContent = titles[m][0];
  document.getElementById("f-ok").textContent = titles[m][1];
  document.getElementById("f-name").value = m === "edit" ? p.name : m === "clone" ? `${p.name} copy` : "";
  document.getElementById("f-color").value = m === "edit" ? p.color :
    ["#4f7cff", "#ff6b4f", "#22b07d", "#b55cff", "#ffb020", "#ff4f9a", "#14a8c4"][Math.floor(Math.random() * 7)];
  dlg.showModal();
}

dlg.addEventListener("close", async () => {
  if (dlg.returnValue !== "ok") return;
  const name = document.getElementById("f-name").value.trim(), color = document.getElementById("f-color").value;
  if (!name) return;
  if (mode === "edit") {
    await api(`/api/profiles/${target.id}`, "PATCH", { name, color }).catch(e => toast(e.message));
    return refresh();
  }
  const key = target?.id || "new";
  busy.add(key); render();
  toast(mode === "clone" ? `Cloning ${target.name}…` : `Creating ${name}… (the first one downloads the browser image, ~1 GB)`);
  try {
    await api("/api/profiles", "POST", { name, color, clone_of: mode === "clone" ? target.id : undefined });
    toast(`${name} is ready`);
  } catch (e) { toast(e.message); }
  busy.delete(key); refresh();
});

document.getElementById("new").onclick = () => openDialog("new");
refresh();
setInterval(() => busy.size || refresh(), 5000);
</script>
</body>
</html>
