<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{NAME}} · locked</title>
<meta name="theme-color" content="{{COLOR}}">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="{{FAVICON}}">
<style>
  html, body { margin: 0; height: 100%; background: #0e0f13; color: #e8eaf0; font: 15px system-ui, sans-serif; }
  main { height: 100%; display: grid; place-content: center; padding: 16px; }
  form { display: grid; gap: 14px; width: min(340px, 90vw); text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; margin: auto; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; color: #8b91a0; }
  input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid #2c313c; background: #17191f; color: #e8eaf0; }
  input:focus-visible, button:focus-visible { outline: 2px solid {{COLOR}}; outline-offset: 2px; }
  button { font: inherit; padding: 10px; border-radius: 10px; border: 0; background: {{COLOR}}; color: #fff; font-weight: 600; cursor: pointer; }
  #err { color: #ff6b6b; min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <form id="f">
    <img src="{{ICON}}" alt="">
    <h1>{{NAME}} is locked</h1>
    <p>Enter this box's password to open it.</p>
    <label for="pw" style="position:absolute;left:-9999px">Box password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button>Unlock</button>
    <div id="err" role="alert"></div>
  </form>
</main>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const r = await fetch("unlock", { method: "POST", headers: { "X-EndlessChrome": "1", "Content-Type": "application/json" },
                                    body: JSON.stringify({ password: document.getElementById("pw").value }) });
  if (r.ok) location.reload();
  else document.getElementById("err").textContent = (await r.json()).error || "Couldn't unlock";
};
</script>
</body>
</html>
